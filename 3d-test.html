<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Cube</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    .crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .crosshair-horizontal {
      width: 20px;
      height: 0;
      border-bottom: 1px solid white;
    }
    .crosshair-vertical {
      width: 0;
      height: 20px;
      border-right: 1px solid white;
    }
  </style>
</head>
<body>
  <pre id="debug" style="position:fixed;color:#ffffff"></pre>
  <div class="crosshair crosshair-horizontal"></div>
  <div class="crosshair crosshair-vertical"></div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

    // Scene
    let scene = new THREE.Scene()
    scene.background = new THREE.Color(0x111111)

    // Camera
    let camera = new THREE.PerspectiveCamera(
      75, // fov
      window.innerWidth / window.innerHeight,
      0.1, // near clipping
      1000 // far clipping
    )

    // Renderer
    let renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.body.appendChild(renderer.domElement)
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap; // Basic, PCF, PCFSoft, VSM
    
    // Lighting
    let ambientLight = new THREE.AmbientLight(0xffffff, 0.1)
    scene.add(ambientLight)
    let hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x222222, 0.3)
    scene.add(hemisphereLight)
    function addDirLight(x,y,z, color, intensity) {
      let directionalLight = new THREE.DirectionalLight(color, intensity)
      directionalLight.position.set(x,y,z)

      directionalLight.castShadow = true
      directionalLight.shadow.mapSize.set(2048, 2048)
      directionalLight.shadow.camera.near = 0.5
      directionalLight.shadow.camera.far = 50
      directionalLight.shadow.camera.left = -10
      directionalLight.shadow.camera.right = 10
      directionalLight.shadow.bias = -0.0005

      scene.add(directionalLight)
    }
    addDirLight(500,1000,1500,0xffffff, 1)
    addDirLight(-1500,1000,-500,0xffffff, 0.1)
    
    // Cube

    let boxes = []
    function addBox(x,y,z,xs=1,ys=1,zs=1, settings = {color:0xffffff}, mat = THREE.MeshStandardMaterial) {
      let geometry = new THREE.BoxGeometry(xs,ys,zs)
      let material = new mat(settings)
      let cube = new THREE.Mesh(geometry, material)
      cube.castShadow = true
      cube.receiveShadow = true
      cube.position.x = x
      cube.position.y = y
      cube.position.z = z
      scene.add(cube)
      boxes.push(cube)
      return cube
    }
    addBox(0,0,0,100,1,100, {color:0x00ff00})
    function addLine(x1, y1, z1, x2, y2, z2, color) {
      let material = new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.2
      })

      let geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x1, y1, z1),
        new THREE.Vector3(x2, y2, z2),
      ])
      let line = new THREE.Line(geometry, material)
      scene.add(line)
      return line
    }
    for (let i = -50; i < 50; i++) addLine(i+0.5,0.51,-50,i+0.5,0.51,50,0xffff00)
    for (let i = -50; i < 50; i++) addLine(-50,0.51,i+0.5,50,0.51,i+0.5,0xffff00)
    function addPlane(items) {
      for (let row of items) {
        for (let val of row) {
          
        }
      }
    }
    addBox(0,1,-5,1,1,1, {color:0xffffff})
    addBox(0,2,-9,1,1,1, {color:0xffffff})
    addBox(0,3,-13,1,1,1, {color:0xffffff})
    addBox(4,4,-13,1,1,1, {color:0xffffff})
    addBox(8,5,-13,1,1,1, {color:0xffffff})
    addBox(12,6,-13,1,1,1, {color:0xffffff})
    addBox(12,7,-9,1,1,1, {color:0xffffff})
    addBox(12,8,-5,1,1,1, {color:0xffffff})
    addBox(8,9,-5,1,1,1, {color:0xffffff})
    addBox(4,10,-5,1,1,1, {color:0xffffff})
    addBox(0,11,-5,1,1,1, {color:0xffffff})
    
    function updateCollision() {
      debug.innerText = ""
      player.onGround = false
      for (let box of boxes) {
        let a = {x: player.x, y: player.y, z: player.z, ...player.hitbox}
        let b = {...box.position, xs: box.geometry.parameters.width, ys: box.geometry.parameters.height, zs: box.geometry.parameters.depth}
        
        // AABB

        let aMinX = a.x - a.xs / 2
        let aMaxX = a.x + a.xs / 2
        let aMinY = a.y - a.ys / 2
        let aMaxY = a.y + a.ys / 2
        let aMinZ = a.z - a.zs / 2
        let aMaxZ = a.z + a.zs / 2
        let bMinX = b.x - b.xs / 2
        let bMaxX = b.x + b.xs / 2
        let bMinY = b.y - b.ys / 2
        let bMaxY = b.y + b.ys / 2
        let bMinZ = b.z - b.zs / 2
        let bMaxZ = b.z + b.zs / 2
      
        let collision = aMinX <= bMaxX &&
        aMaxX >= bMinX &&
        aMinY <= bMaxY &&
        aMaxY >= bMinY &&
        aMinZ <= bMaxZ &&
        aMaxZ >= bMinZ

        if (collision) {
          let distances = [
            [bMaxX - aMinX, {x: 1,y: 0,z: 0, type: "x"}], // right
            [aMaxX - bMinX, {x:-1,y: 0,z: 0, type: "x"}], // left
            [bMaxY - aMinY, {x: 0,y: 1,z: 0, type: "y"}], // top
            [aMaxY - bMinY, {x: 0,y:-1,z: 0, type: "y"}], // bottom
            [bMaxZ - aMinZ, {x: 0,y: 0,z: 1, type: "z"}], // front
            [aMaxZ - bMinZ, {x: 0,y: 0,z:-1, type: "z"}]  // back
          ]
          let leastDistance = 1/0
          let optimalMovement
          for (let d of distances) {
            if (d[0] < leastDistance) {
              leastDistance = d[0]
              optimalMovement = d[1]
            }
          }
          if (optimalMovement.type == "x") {
            player.x -= player.velX
            player.velX = 0
          }
          if (optimalMovement.type == "y") {
            player.y -= player.velY
            player.velY = 0
          }
          if (optimalMovement.type == "z") {
            player.z -= player.velZ
            player.velZ = 0
          }
          player.onGround = player.onGround || (optimalMovement.y == 1)
        }
      }
    }

    // Player
    let player = {
      x: 0,
      y: 10,
      z: 0,
      rotationX: 0,
      rotationY: 0,
      rotationZ: 0,
      speed: 0.015,
      jumpPower: 0.175,
      velX: 0,
      velY: 0,
      velZ: 0,
      height: 0.5,
      yaw: 0,
      pitch: 0,
      friction: 1.2,
      frictionY: 1.01,
      onGround: false,
      hitbox: {
        xs: 0.6666,
        ys: 2,
        zs: 0.6666
      },
      gravity: 0.007,
    }

    function updatePlayer() {
      if (keys["w"]) {
        player.velX -= player.speed * Math.sin(player.yaw)
        player.velZ -= player.speed * Math.cos(player.yaw)
      }
      if (keys["s"]) {
        player.velX += player.speed * Math.sin(player.yaw)
        player.velZ += player.speed * Math.cos(player.yaw)
      }
      if (keys["a"]) {
        player.velX -= player.speed * Math.cos(player.yaw)
        player.velZ += player.speed * Math.sin(player.yaw)
      }
      if (keys["d"]) {
        player.velX += player.speed * Math.cos(player.yaw)
        player.velZ -= player.speed * Math.sin(player.yaw)
      }
      if (keys[" "] && player.onGround) {
        player.velY += player.jumpPower
      }
      
      player.x += player.velX
      player.y += player.velY
      player.z += player.velZ

      updateCollision()

      player.velY -= player.gravity
      player.velX /= player.friction
      player.velY /= player.frictionY
      player.velZ /= player.friction
      camera.position.x = player.x
      camera.position.y = player.y + player.height
      camera.position.z = player.z
    }

    // Listeners

    let keys = {}
    let mouse = {
      down: false,
    }
    addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true
    })
    addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false
    })
    renderer.domElement.addEventListener("click", (e) => {
      renderer.domElement.requestPointerLock()
    })
    renderer.domElement.addEventListener("mousedown", (e) => {
      mouse.down = true
    })
    renderer.domElement.addEventListener("mousemove", (e) => {
      if (document.pointerLockElement === renderer.domElement) {
        player.yaw -= e.movementX/window.innerWidth*Math.PI
        player.pitch -= e.movementY/window.innerHeight*Math.PI
        camera.rotation.order = "YXZ" // this appears to work for some reason
        player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch))
        camera.rotation.x = player.pitch
        camera.rotation.y = player.yaw
      }
    })
    
    renderer.domElement.addEventListener("mouseup", (e) => {
      mouse.down = false
    })

    // Animation
    let targetFPS = 60
    let lastRender = 0
    function animate() {
      updatePlayer()
      if (Date.now() - lastRender < 1000/targetFPS) {
        requestAnimationFrame(animate)
        return
      }
      renderer.render(scene, camera)
      requestAnimationFrame(animate)
    }
    animate()
  </script>
</body>
</html>
