<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      width: 100%;
      height: 100%;
      background-color: #000000;
    }
    canvas {
      width: 100vmin;
      height: 100vmin;
      background-color: #000000;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    let canvas = document.getElementById("canvas")
    let ctx = canvas.getContext("2d")
    canvas.width = 2000
    canvas.height = 2000
    let state = {
      x: 0,
      y: 0,
      initalLevel: null,
      level: null,
      needsDraw: true,
    }
    let config = {
      colors: [
        "#f5ef42",
        "#00ff55",
        "#42c5ff",

        "#4248f5", 
        "#a842f5", 
        "#f5428d", 

        "#f54242",
        "#8b0000" ,
        "#3a2c2c"
      ]
    }
    function copy(arr2d) {
      return arr2d.map(a=>a.map(b=>b))
    }
    function loadLevel(grid, startX, startY) {
      state.x = startX
      state.y = startY
      state.level = grid
      state.initalLevel = grid
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      // draw level
      let gridSize = state.level.length
      let padding = 0.05
      let edgePadding = 0.05

      let offset = canvas.width * edgePadding/2
      let width = canvas.width * (1-edgePadding)
      let cellSize = width/gridSize*(1-padding*2)
      let cellSpacing = width/gridSize
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.font = "150px Arial"
      ctx.globalAlpha = 1
      for (let x = 0; x < gridSize; x++) {
        for (let y = 0; y < gridSize; y++) {
          let currentNumber = state.level[y][x]
          if (currentNumber == 0) continue
          let posX = offset + cellSpacing*(x+0.5)
          let posY = offset + cellSpacing*(y+0.5)
          let size = cellSize
          ctx.beginPath()
          ctx.roundRect(posX-size/2,posY-size/2,size,size, 100)
          ctx.fillStyle = config.colors[Math.min(config.colors.length-1, currentNumber-1)]
          ctx.fill()

          ctx.fillStyle = "#ffffff"
          ctx.fillText(currentNumber, posX, posY)
        }
      }
      ctx.globalAlpha = 0.7
      ctx.fillStyle = "#000000"
      ctx.beginPath()
      ctx.lineWidth = cellSize/20
      ctx.arc(offset + (state.x+0.5) * cellSpacing, offset + (state.y+0.5) * cellSpacing, cellSize/2/1.5, 0, 6.29)
      ctx.stroke()
    }
    function animate() {
      requestAnimationFrame(animate)
      if (!state.needsDraw) return
      state.needsDraw = false
      draw()
    }
    loadLevel([
      [1,2,3],
      [4,5,6],
      [7,8,9],
    ],0,0)
    requestAnimationFrame(animate)
  </script>
</body>
</html>
