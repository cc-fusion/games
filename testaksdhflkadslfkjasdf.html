<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #application {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh;
      padding: 12px;
      background: #000;
    }

    #canvas {
      display: block;
      width: min(100%, calc(100dvh - 80px));
      height: auto;
      aspect-ratio: 1 / 1;
      flex: 0 1 auto;
      background: #000;
      border: 1px solid #222;
    }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(100%, calc(100dvh - 80px));
      flex: 0 0 auto;
      padding: 8px 0;
      background: #000;
    }

    #status-bar button {
      padding: 5px 8px;
      border: 1px solid #333;
      border-radius: 2px;
      background: transparent;
      color: #ccc;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #status-bar button.highlighted {
      box-shadow: 0 0 10px 2px rgba(255, 215, 0, 0.6);
    }


    #status-bar button:hover {
      color: #fff;
      border-color: #777;
    }

    #status-text {
      margin: 0;
      color: #888;
      font: 12px monospace;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="application">
    <canvas id="canvas"></canvas>
    <div id="status-bar">
      <button id="btn-reset">Reset</button>
      <button id="btn-new-lvl">Generate new level</button>
      <pre id="status-text">Loading...</pre>
    </div>
  </div>
  <script>
    class SimulatedState() {
      constructor(grid, x, y, moves) {
        this.grid = grid
        this.x = x
        this.y = y
        this.moves = moves
      }
      canMove(x, y) {
        let newX = this.x + x
        let newY = this.y + y
        return newX >= 0 && newX < this.grid.length &&
        newY >= 0 && newY < this.grid.length &&
        this.grid[this.y][this.x] != 0
      }
      move(x, y) {
        if (!this.canMove(x,y)) return false
        grid[this.y][this.x]--
        this.x += x
        this.y += y
        this.moves++
        return true
      }
      undoMove(x, y) {
        this.x -= x
        this.y -= y
        grid[this.y][this.x]++
        this.moves--
      }
    }
    class SimulatedGame() {
      constructor(grid, x, y) {
        this.grid = grid.map(a=>[...a])
        this.x = x
        this.y = y
        this.state = new SimulatedState(this.grid, x, y, 0)
      }
      solve() {

      }
    }
  </script>
  <script>
    let canvas = document.getElementById("canvas")
    let ctx = canvas.getContext("2d")
    let statusText = document.getElementById("status-text")
    let btnReset = document.getElementById("btn-reset")
    let btnNewLevel = document.getElementById("btn-new-lvl")
    canvas.width = 2000
    canvas.height = 2000
    let state = {
      x: 0,
      y: 0,
      moves: 0,
      initState: null,
      level: null,
      needsDraw: true,
      rendering: {
        offset: 0,
        width: 0,
        cellSize: 0,
        cellSpacing: 0,
      },
    }
    let config = {
      colors: {
        numbers: [
          "#f5ef42",
          "#00ff55",
          "#42c5ff",
          "#4248f5", 
          "#a842f5", 
          "#f5428d", 
          "#f54242",
          "#8b0000",
        ],
        "solid": "#3a2c2c",
      },
      padding: 0.05,
      edgePadding: 0.05
    }
    function copy(arr2d) {
      return arr2d.map(a=>a.map(b=>b))
    }
    function loadLevel(grid, startX, startY) {
      state.x = startX
      state.y = startY
      state.level = grid.map(a=>[...a])

      state.rendering.offset = canvas.width * config.edgePadding/2
      state.rendering.width = canvas.width * (1-config.edgePadding)
      state.rendering.cellSize = state.rendering.width/grid.length*(1-config.padding*2)
      state.rendering.cellSpacing = state.rendering.width/grid.length
      
      state.reset = ()=>{
        loadLevel(grid, startX, startY)
      }
      state.needsDraw = true
      state.moves = 0
      btnReset.classList.remove("highlighted")
      btnNewLevel.classList.remove("highlighted")
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      // draw level
      
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.font = state.rendering.cellSize/5+"px Arial"
      ctx.globalAlpha = 1
      for (let x = 0; x < state.level.length; x++) {
        for (let y = 0; y < state.level.length; y++) {
          let currentNumber = state.level[y][x]
          if (currentNumber == 0) continue
          let posX = state.rendering.offset + state.rendering.cellSpacing*(x+0.5)
          let posY = state.rendering.offset + state.rendering.cellSpacing*(y+0.5)
          let size = state.rendering.cellSize
          ctx.beginPath()
          ctx.roundRect(posX-size/2,posY-size/2,size,size, canvas.width/2000*100)
          if (currentNumber == "solid") {
            ctx.fillStyle = config.colors.solid
          } else {
            ctx.fillStyle = config.colors.numbers[Math.min(config.colors.numbers.length-1, currentNumber-1)]
          }
          ctx.fill()

          ctx.fillStyle = "#ffffff"
          ctx.fillText(currentNumber, posX, posY)
        }
      }
      ctx.globalAlpha = 0.7
      ctx.fillStyle = "#000000"
      ctx.beginPath()
      ctx.lineWidth = state.rendering.cellSize/20
      ctx.arc(state.rendering.offset + (state.x+0.5) * state.rendering.cellSpacing, state.rendering.offset + (state.y+0.5) * state.rendering.cellSpacing, state.rendering.cellSize/2/1.5, 0, 6.29)
      ctx.stroke()

      statusText.innerText = "Moves: " + state.moves
    }
    function animate() {
      requestAnimationFrame(animate)
      if (!state.needsDraw) return
      state.needsDraw = false
      draw()
    }
    function canMove(x,y) {
      let newX = state.x + x
      let newY = state.y + y
      if (newX < 0 || newX >= state.level.length || newY < 0 || newY >= state.level.length) return false
      if (state.level[newY][newX] == 0) return false
      return true
    }
    function isEmpty() {
      let total = 0
      for (let row of state.level) {
        for (let x of row) {
          total += x
          if (total > 1) return false
        }
      }
      return true
    }
    function isStuck() {
      return !canMove(0,1) && !canMove(0,-1) && !canMove(1,0) && !canMove(-1,0)
    }
    function move(x,y) {
      if (!canMove(x,y)) return false
      let currentBlock = state.level[state.y][state.x]
      let newBlock = currentBlock
      if (currentBlock == "solid") {
        newBlock = "solid"
      } else {
        newBlock--
      }
      state.level[state.y][state.x] = newBlock
      state.x += x
      state.y += y
      state.moves++
      state.needsDraw = true
      return true
    }

    let keys = {}
    let mouse = {}
    function initListeners() {
      addEventListener("keydown", (e) => {
        let key = e.key.toLowerCase()
        keys[key] = true
        if (key == "arrowup") move(0,-1)
        if (key == "arrowdown") move(0,1)
        if (key == "arrowleft") move(-1,0)
        if (key == "arrowright") move(1,0)
        if (key == "r") state.reset()
        if (isStuck()) {
          if (isEmpty()) {
            btnNewLevel.classList.add("highlighted")
          } else {
            btnReset.classList.add("highlighted")
          }
        }
      })
      addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false
      })
      addEventListener("mousemove", (e) => {
        mouse.x = e.clientX
        mouse.y = e.clientY
      })
      addEventListener("mousedown", (e) => {
        mouse.down = true
      })
      addEventListener("mouseup", (e) => {
        mouse.down = false
      })
      btnReset.addEventListener("click", (e) => {
        state.reset()
      })
      btnNewLevel.addEventListener("click", (e) => {
        load()
      })
    }
    function defaultVal(v, d) {
      if (!isFinite(v) || isNaN(v) || d == null || d == undefined) return d
      return v
    }
    function generateLevel(size, overrideOptions={}) {
      let options = {
        iter: 10,
        lessValueBias: 0.1,
        emptyValueBias: 1,
        ...overrideOptions
      }
      let grid = []
      for (let i = 0; i < size; i++) {
        grid.push([])
        for (let j = 0; j < size; j++) {
          grid[i].push(0)
        }
      }
      let player = {x: 0, y: 0}
      for (let i = 0; i < options.iter; i++) {
        let bias = {
          up: player.y - 1 < 0 ? 0 : 1,
          down: player.y + 1 >= grid.length ? 0 : 1,
          left: player.x - 1 < 0 ? 0 : 1,
          right: player.x + 1 >= grid.length ? 0 : 1
        }
        let cellUp =    grid[player.y-1]?.[player.x]*options.lessValueBias
        let cellDown =  grid[player.y+1]?.[player.x]*options.lessValueBias
        let cellLeft =  grid[player.y]?.[player.x-1]*options.lessValueBias
        let cellRight = grid[player.y]?.[player.x+1]*options.lessValueBias

        bias.up    *= defaultVal(1/cellUp   , options.emptyValueBias)
        bias.down  *= defaultVal(1/cellDown , options.emptyValueBias)
        bias.left  *= defaultVal(1/cellLeft , options.emptyValueBias)
        bias.right *= defaultVal(1/cellRight, options.emptyValueBias)

        bias.up = Math.max(0,bias.up)
        bias.down = Math.max(0,bias.down)
        bias.left = Math.max(0,bias.left)
        bias.right = Math.max(0,bias.right)
        
        let total = bias.up + bias.down + bias.left + bias.right
        bias.up /= total
        bias.down /= total
        bias.left /= total
        bias.right /= total

        bias.down += bias.up
        bias.left += bias.down
        bias.right += bias.left
        let random = Math.random()
        grid[player.y][player.x]++;
        if (random < bias.up) {
          player.y -= 1
        } else if (random < bias.down) {
          player.y += 1
        } else if (random < bias.left) {
          player.x -= 1
        } else {
          player.x += 1
        }
      }
      return grid
    }
    function load() {
      loadLevel(generateLevel(7,{
        iter: 100,
        lessValueBias: 1000,
        emptyValueBias: 1/10000,
      }),0,0)
    }
    load()
    initListeners()
    requestAnimationFrame(animate)
  </script>
</body>
</html>
