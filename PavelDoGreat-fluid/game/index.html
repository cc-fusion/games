<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Simulation Boilerplate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06062C;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmin;
      height: 100vmin;
    }
  </style>
</head>
<body>
  <canvas id="fluid-canvas"></canvas>
  <canvas id="canvas-overlay"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/cc-fusion/vibecoding@main/vibecoding/PavelDoGreat-fluid-API/api-v1.0.0.js"></script>
  
  <script>
    let fluidCanvas = document.getElementById("fluid-canvas")
    let canvas = document.getElementById("canvas-overlay")
    canvas.width = 2000
    canvas.height = 2000
    let canvasHypot = Math.hypot(canvas.width, canvas.height)
    let ctx = canvas.getContext("2d")

    if (!FluidSimulation) {
      alert("Failed to initalize FluidSimulation")
      throw "Failed to initalize FluidSimulation"
    }

    let sim = FluidSimulation.create(fluidCanvas, {
      SIM_RESOLUTION: 128,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 1.0,
      VELOCITY_DISSIPATION: 0.2,
      PRESSURE: 0.2,
      CURL: 30,
      SPLAT_RADIUS: 0.25,
      SPLAT_FORCE: 6000,
      SHADING: true,
      COLORFUL: true,
      BACK_COLOR: '#000000'
    })
    sim.start()

    class Vector {
      constructor(x,y) {
        this.x = x
        this.y = y
      }
      getRenderX() {return this.x*canvas.width}
      getRenderY() {return this.y*canvas.height}
      add(other) {this.x+=other.x;this.y+=other.y;return this}
      subtract(other) {this.x-=other.x;this.y-=other.y;return this}
      multiplyScalar(i) {this.x*=i;this.y*=i;return this}
      get magnitude() {return Math.hypot(this.x, this.y)}
      norm() {this.x==0&&this.y==0?this:this.multiplyScalar(1/this.magnitude);return this}
      copy() {return new Vector(this.x, this.y)}
    }
    let player = {
      get x() {document.documentElement.innerText = "You used player.x somewhere"},
      get y() {document.documentElement.innerText = "You used player.y somewhere"},
      set x(a) {document.documentElement.innerText = "You used player.x somewhere"},
      set y(a) {document.documentElement.innerText = "You used player.y somewhere"},
      pos: new Vector(0.5, 0.5),
      vel: new Vector(0,0),
      speed: 0.2, // in canvas units
      friction: 1.01,
      weight: 1,
      wallBounciness: 1,
    }
    let keys = {}
    addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true
    })
    addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false
    })
    function updateKeys() {
      let newVel = new Vector(0,0)
      if (keys["arrowup"] || keys["w"]) newVel.y -= 1
      if (keys["arrowdown"] || keys["s"]) newVel.y += 1
      if (keys["arrowleft"] || keys["a"]) newVel.x -= 1
      if (keys["arrowright"] || keys["d"]) newVel.x += 1
      player.vel.add(newVel.norm().multiplyScalar(player.speed/canvasHypot))
    }
    function updatePlayer() {
      player.pos.add(player.vel)
      player.vel.multiplyScalar(1/player.friction)
      if (player.pos.x < 0) {
        player.pos.x = 0
        player.vel.x *= -player.wallBounciness
      }
      if (player.pos.x > 1) {
        player.pos.x = 1
        player.vel.x *= -player.wallBounciness
      }
      if (player.pos.y < 0) {
        player.pos.y = 0
        player.vel.y *= -player.wallBounciness
      }
      if (player.pos.y > 1) {
        player.pos.y = 1
        player.vel.y *= -player.wallBounciness
      }
      let vel = player.vel.copy().multiplyScalar(canvasHypot)
      sim.splat(player.pos.x, player.pos.y, vel.x, vel.y)
    }
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.beginPath()
      ctx.arc(player.pos.getRenderX(), player.pos.getRenderY(), 20, 0, 6.29)
      ctx.fillStyle = "#ff0000"
      ctx.fill()
    }
    function animate() {
      updateKeys()
      updatePlayer()
      render()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>
</html>
