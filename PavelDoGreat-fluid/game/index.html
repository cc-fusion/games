<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Simulation Boilerplate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06062C;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmin;
      height: 100vmin;
    }
  </style>
</head>
<body>
  <canvas id="fluid-canvas"></canvas>
  <canvas id="canvas-overlay"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/cc-fusion/vibecoding@main/vibecoding/PavelDoGreat-fluid-API/api-v1.0.0.js"></script>
  
  <script>
    let fluidCanvas = document.getElementById("fluid-canvas")
    let canvas = document.getElementById("canvas")
    canvas.width = 2000
    canvas.height = 2000
    let ctx = canvas.getContext("2d")

    if (!FluidSimulation) {
      alert("Failed to initalize FluidSimulation")
      throw "Failed to initalize FluidSimulation"
    }

    let sim = FluidSimulation.create(fluidCanvas, {
      SIM_RESOLUTION: 128,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 1.0,
      VELOCITY_DISSIPATION: 0.2,
      PRESSURE: 0.2,
      CURL: 30,
      SPLAT_RADIUS: 0.25,
      SPLAT_FORCE: 6000,
      SHADING: true,
      COLORFUL: true,
      BACK_COLOR: '#000000'
    })
    sim.start()
    class Vector {
      constructor(x,y) {
        this.x = x
        this.y = y
      }
      add(other) {this.x+=other.x;this.y+=other.y;return this}
      subtract(other) {this.x-=other.x;this.y-=other.y;return this}
      multiplyScalar(i) {this.x*=i;this.y*=i;return this}
      get magnitude() {return Math.sqrt(this.x**2+this.y**2)}
      norm() {this.multiplyScalar(1/this.magnitude);return this}
    }
    let player = {
      pos: new Vector(0,0),
      vel: new Vector(0,0),
      speed: 0.1,
    }
    let keys = {}
    addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true
    })
    addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false
    })
    function updateKeys() {
      if (keys["arrowup"] || keys["w"]) player.vel.y -= player.speed
      if (keys["arrowdown"] || keys["s"]) player.vel.y += player.speed
      if (keys["arrowleft"] || keys["a"]) player.vel.x -= player.speed
      if (keys["arrowright"] || keys["d"]) player.vel.x += player.speed
    }
    function updatePlayer() {
      player.pos.add(player.vel)
      player.vel.multiplyScalar(1/1.01)
    }
    function animate() {
      updateKeys()
      updatePlayer()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>
</html>
