<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Simulation Boilerplate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06062C;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmin;
      height: 100vmin;
    }
  </style>
</head>
<body>
  <canvas id="fluid-canvas"></canvas>
  <canvas id="canvas-overlay"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/cc-fusion/vibecoding@main/vibecoding/PavelDoGreat-fluid-API/api-v1.0.0.js"></script>
  <script>
    /* Math classes */
    class Vector {
      constructor(x,y) {
        this.x = x
        this.y = y
      }
      add(other) {this.x+=other.x;this.y+=other.y;return this}
      subtract(other) {this.x-=other.x;this.y-=other.y;return this}
      multiplyScalar(i) {this.x*=i;this.y*=i;return this}
      get magnitude() {return Math.hypot(this.x, this.y)}
      norm() {this.x==0&&this.y==0?this:this.multiplyScalar(1/this.magnitude);return this}
      copy() {return new Vector(this.x, this.y)}
    }
    class Color {
      static getMagnitude(c) {return Math.sqrt(c[0]*c[0] + c[1]*c[1] + c[2]*c[2])}
      static norm(c) {
        let mag = Color.getMagnitude(c)
        return [c[0]/mag, c[1]/mag, c[2]/mag]
      }
      static multiply(c, m) {return [c[0]*m, c[1]*m, c[2]*m]}
    }
  </script>
  <script>
    let fluidCanvas = document.getElementById("fluid-canvas")
    let canvas = document.getElementById("canvas-overlay")
    canvas.width = 2000
    canvas.height = 2000
    let canvasHypot = Math.hypot(canvas.width, canvas.height)
    let ctx = canvas.getContext("2d")

    if (!FluidSimulation) {
      alert("Failed to initalize FluidSimulation")
      throw "Failed to initalize FluidSimulation"
    }

    let sim = FluidSimulation.create(fluidCanvas, {
      SIM_RESOLUTION: 256,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 0.5,
      VELOCITY_DISSIPATION: 0.1,
      PRESSURE: 0,
      CURL: 20,
      SPLAT_RADIUS: 0.03,
      SPLAT_FORCE: 600,
      SHADING: true,
      COLORFUL: true,
      BACK_COLOR: '#000000'
    })
    sim.start()

    let keys = {}
    let mouse = {movement: new Vector(0,0),lastMovementTime: 0}
    function initListeners() {
      addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true
      })
      addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false
      })
      canvas.addEventListener("click", (e) => {
        canvas.requestPointerLock() 
      })
      addEventListener("mousemove", (e) => {
        mouse.movement.x = e.movementX
        mouse.movement.y = e.movementY
        mouse.lastMovementTime = Date.now()
      })
      addEventListener("mousedown", (e) => {
        mouse.down = true
      })
      addEventListener("mouseup", (e) => {
        mouse.down = false
      })
    }
    initListeners()
    
    class Unit {
      updateMovement() { 
        if (this.pos.x < 0) { 
          this.pos.x = 0 
          this.vel.x *= -this.wallBounciness 
        } 
        if (this.pos.x > 1) { 
          this.pos.x = 1 
          this.vel.x *= -this.wallBounciness 
        } 
        if (this.pos.y < 0) { 
          this.pos.y = 0 
          this.vel.y *= -this.wallBounciness 
        } 
        if (this.pos.y > 1) { 
          this.pos.y = 1 
          this.vel.y *= -this.wallBounciness 
        }
        this.pos.add(this.vel) 
        this.vel.multiplyScalar(1/this.friction) 
      }
    }
    class Player extends Unit {
      constructor(pos) {
        this.pos = new Vector(0.5, 0.5)
        this.vel = new Vector(0,0)
        this.shootColor = [0, 0.1, 0.2]
        this.speed = 0.005
        this.wallBounciness = 1
      }
      updateFromKeys() { 
        let newVel = new Vector(0,0)
        if (keys["arrowup"] || keys["w"]) newVel.y -= 1
        if (keys["arrowdown"] || keys["s"]) newVel.y += 1
        if (keys["arrowleft"] || keys["a"]) newVel.x -= 1
        if (keys["arrowright"] || keys["d"]) newVel.x += 1
        this.vel.add(newVel.norm().multiplyScalar(this.speed/canvasHypot))
      } 
      updateShooting() {

      }
      update() {
        this.updateMovement()
        this.updateFromKeys()
        this.updateShooting()
      }
      render() {
        ctx.beginPath()
        ctx.arc(this.pos.x * canvas.width, this.pos.y * canvas.height)
        ctx.fillStyle = "#0f0"
        ctx.fill()
      }
    }
    class Enemy extends Unit {
      constructor(pos, speed, optionsOverride = {}) {
        let options = {
          shootColor: [1,1,0],
          friction: 1.01,
          vel: new Vector(0,0),
          ...optionsOverride
        }
        this.pos = pos
        this.speed = speed
        this.shootColor = options.shootColor
        this.vel = options.vel
        this.friction = options.friction
      }
      update() {
        this.updateMovement()
        let movementVector = new Vector(player.pos.x - this.pos.x, player.pos.y - this.pos.y).norm().multiplyScalar(this.speed)
        this.vel.add(movementVector)
      }

    }

    let player = new Player()
    let enemies = [
      new Enemy(new Vector(0.1,0.1),0.005)
    ]

    function animate() {
      // updating
      player.update()
      for (let enemy of enemies) enemy.update()
      enemies = enemies.filter(enemy => !enemy.dead)
      
      // rendering
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      
      if (Date.now() > mouse.lastMovementTime + 1000/15) {
        mouse.movement.x = 0
        mouse.movement.y = 0
      }
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>
</html>
