<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Simulation Boilerplate</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06062C;
    }

    #fluid-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmin;
      height: 100vmin;
    }
  </style>
</head>
<body>
  <canvas id="fluid-canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/gh/cc-fusion/vibecoding@main/vibecoding/PavelDoGreat-fluid-API/api-v1.0.0.js"></script>
  
  <script>
    let canvas = document.getElementById("fluid-canvas")

    if (!FluidSimulation) {
      alert("Failed to initalize FluidSimulation")
      throw "Failed to initalize FluidSimulation"
    }

    let sim = FluidSimulation.create(canvas, {
      SIM_RESOLUTION: 128,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 1.0,
      VELOCITY_DISSIPATION: 0.2,
      PRESSURE: 0.2,
      CURL: 30,
      SPLAT_RADIUS: 0.25,
      SPLAT_FORCE: 6000,
      SHADING: true,
      COLORFUL: true,
      BACK_COLOR: '#000000'
    })

    sim.use(FluidExtensions.pointer())
    sim.start()
    sim.randomSplats(5)
  </script>
</body>
</html>
