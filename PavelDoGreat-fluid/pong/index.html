<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluid Simulation Pong</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06062C;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmin;
      height: 100vmin;
    }

    #score {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <canvas id="fluid-canvas"></canvas>
  <canvas id="canvas-overlay"></canvas>
  <h1 id="score">0 | 0</h1>

  <script src="https://cdn.jsdelivr.net/gh/cc-fusion/vibecoding@main/vibecoding/PavelDoGreat-fluid-API/api-v1.0.0.js">
  </script>

  <script>
    let fluidCanvas = document.getElementById("fluid-canvas")
    let canvas = document.getElementById("canvas-overlay")
    let scoreElement = document.getElementById("score")
    canvas.width = 2000
    canvas.height = 2000
    let canvasHypot = Math.hypot(canvas.width, canvas.height)
    let ctx = canvas.getContext("2d")

    if (!FluidSimulation) {
      alert("Failed to initalize FluidSimulation")
      throw "Failed to initalize FluidSimulation"
    }

    let sim = FluidSimulation.create(fluidCanvas, {
      SIM_RESOLUTION: 512,
      DYE_RESOLUTION: 1024,
      DENSITY_DISSIPATION: 0.8,
      VELOCITY_DISSIPATION: 0.2,
      PRESSURE: 0,
      CURL: 30,
      SPLAT_RADIUS: 0.1,
      SPLAT_FORCE: 600,
      SHADING: true,
      COLORFUL: true,
      BACK_COLOR: '#000000'
    })
    sim.start()

    class Vector {
      constructor(x,y) {
        this.x = x
        this.y = y
      }
      getRenderX() {return this.x*canvas.width}
      getRenderY() {return this.y*canvas.height}
      add(other) {this.x+=other.x;this.y+=other.y;return this}
      subtract(other) {this.x-=other.x;this.y-=other.y;return this}
      multiplyScalar(i) {this.x*=i;this.y*=i;return this}
      get magnitude() {return Math.hypot(this.x, this.y)}
      norm() {this.x==0&&this.y==0?this:this.multiplyScalar(1/this.magnitude);return this}
      copy() {return new Vector(this.x, this.y)}
    }
    function getNewColor(m) {
      return [Math.random()*30,Math.random()*30,Math.random()*30]
    }
    let ball = {
      pos: new Vector(0.5,0.5),
      vel: new Vector(0.005,0.001),
      color: getNewColor(Math.hypot(0.005, 0.001))
    }
    function multiplyColor(rgb, x) {
      return [rgb[0] * x, rgb[1] * x, rgb[2] * x]
    }
    class Paddle {
      constructor(x, y, direction, height = 0.12, width = 0.02) {
        this.x = x
        this.y = y
        this.direction = direction
        this.height = height
        this.width = width
        this.prevY = y
      }
      updateBall() {
        let top = this.y + this.height/2
        let bottom = this.y - this.height/2
        if (ball.pos.y > top || ball.pos.y < bottom) return
        if (
          (this.direction == "left" && ball.pos.x < this.x + this.width) ||
          (this.direction == "right" && ball.pos.x > this.x - this.width)
        ) {
          ball.vel.x = Math.abs(ball.vel.x) * (this.direction == "left" ? 1.1 : -1.1)
          ball.vel.y += (ball.pos.y - this.y) / this.height * 0.01
          ball.color = getNewColor(ball.vel.magnitude)
        }
      }
      render() {
        ctx.fillStyle = "#ffffff"
        ctx.fillRect(
          (this.x - this.width/2) * canvas.width,
          (this.y - this.height/2) * canvas.height,
          this.width * canvas.width,
          this.height * canvas.height
        )
      }
    }
    let paddle1 = new Paddle(0.05, 0.5, "left")
    let paddle2 = new Paddle(1-0.05, 0.5, "right")
    let rect = canvas.getBoundingClientRect()
    let score = [0,0]
    addEventListener("mousemove", (e) => {
      paddle1.y = (e.clientY - rect.top) / rect.height
    })
    function update() {
      ball.pos.add(ball.vel)
      paddle1.updateBall()
      paddle2.updateBall()
    }
    function reset() {
      ball.pos.x = 0.5
      ball.pos.y = 0.5
      ball.vel.x = Math.random() < 0.5 ? 0.005 : -0.005
      ball.vel.y = (Math.random()-0.5) * 2 * 0.005
      ball.color = getNewColor(ball.vel.magnitude)
      scoreElement.innerText = score[0] + " | " + score[1]
    }
    function timedInterval(callback, interval, times) {
      let i = 0
      let intervalID = setInterval(()=>{
        if (i > times) {
          clearInterval(intervalID)
          return
        }
        callback(i)
        i++
      }, interval)
      return intervalID
    }
    function predictAIBallPos(randomness = 0.1) {
      let ballCopy = {
        pos: new Vector(ball.pos.x, ball.pos.y),
        vel: new Vector(ball.vel.x, ball.vel.y)
      }
      let speed = ball.vel.magnitude
      while (ballCopy.pos.x > 0 && ballCopy.pos.x < 1) {
        ballCopy.pos.x *= 1+(Math.random() - 0.5) * 2 * randomness
        ballCopy.pos.y *= 1+(Math.random() - 0.5) * 2 * randomness

        ballCopy.pos.add(ballCopy.vel)
        if (ballCopy.pos.y < 0) {
          ballCopy.pos.y = 0
          ballCopy.vel.y *= -1+(Math.random() - 0.5) * 2 * randomness
        }
        if (ballCopy.pos.y > 1) {
          ballCopy.pos.y = 1
          ballCopy.vel.y *= -1+(Math.random() - 0.5) * 2 * randomness
        }
      }
      return ballCopy.pos.add(ballCopy.vel.multiplyScalar(1+9*(Math.random()-0.5)*2)).y
    }
    function updateAIPaddle() {
      let paddleSpeed = Math.abs(paddle2.y - ball.pos.y) * 0.1
      let target = ball.pos.y - ball.vel.y
      if (ball.vel.x < 0) return
      if (ball.vel.x * 25 > ball.pos.x) return
      let movement = (paddle2.y - (ball.pos.y + predictAIBallPos(0.01)) / 2) / 10
      paddle2.y -= movement
    }
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.beginPath()
      ctx.arc(ball.pos.getRenderX(), ball.pos.getRenderY(), 20, 0, 6.29)
      ctx.fillStyle = "#ffffff"
      ctx.fill()
      paddle1.render()
      updateAIPaddle()
      paddle2.render()
      
      sim.splat(ball.pos.x, ball.pos.y, ball.vel.x * canvas.width, ball.vel.y * canvas.height, multiplyColor(ball.color, ball.vel.magnitude))
      
      
      if (ball.pos.y < 0) {
        ball.pos.y = 0
        ball.vel.y *= -1
      }
      if (ball.pos.y > 1) {
        ball.pos.y = 1
        ball.vel.y *= -1
      }
      let loseSplatDensity = 200
      let loseSplatForce = 1000
      if (ball.pos.x < 0) {
        let yPos = ball.pos.y
        let velMag = ball.vel.magnitude
        let color = [...ball.color]
        timedInterval((i) => {
          for (let height = -1; height < 1; height += 0.1) {
          sim.splat(0.1*i/10, yPos + height/100, loseSplatForce, 0, multiplyColor(color, ball.vel.magnitude * loseSplatDensity))
          }
        }, 0, 10)

        score[1]++
        reset()
      }
      if (ball.pos.x > 1) {
        let yPos = ball.pos.y
        let velMag = ball.vel.magnitude
        let color = [...ball.color]
        timedInterval((i) => {
          for (let height = -1; height < 1; height += 0.1) {
          sim.splat(1-0.1*(1-i/10), yPos + height/100, -loseSplatForce, 0, multiplyColor(color, ball.vel.magnitude * loseSplatDensity))
          }
        }, 0, 10)
        
        score[0]++
        reset()
      }
      sim.splat(
        paddle1.x, 
        paddle1.y, 
        Math.random()-0.5, 
        canvas.height*(paddle1.y - paddle1.prevY), 
        multiplyColor([0.1,0.1,0.1], 30*Math.abs(paddle1.y-paddle1.prevY))
      )
      sim.splat(
        paddle2.x, 
        paddle2.y, 
        Math.random()-0.5, 
        canvas.height*(paddle2.y - paddle2.prevY), 
        multiplyColor([0.1,0.1,0.1], 30*Math.abs(paddle2.y-paddle2.prevY))
      )
      
      paddle1.prevY = paddle1.y
      paddle2.prevY = paddle2.y
      ball.vel.x = Math.min(Math.max(ball.vel.x,-0.03),0.03)
      ball.vel.y = Math.min(Math.max(ball.vel.y,-0.03),0.03)
    }
    reset()
    
    function animate() {
      update()
      render()
      requestAnimationFrame(animate)
    }
    requestAnimationFrame(animate)
  </script>
</body>

</html>
